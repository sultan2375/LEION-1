<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>LEION Reward App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:
  radial-gradient(circle at top,#06361d 0%,#01040c 35%,#000000 100%);
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
  position:relative;
}

body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background-image:
  radial-gradient(#22ff6650 1px,transparent 1px);
  background-size:35px 35px;
  opacity:0.25;
  pointer-events:none;
}

.snake-left{
  position:absolute;
  left:-40px;
  top:150px;
  width:150px;
  opacity:0.25;
  filter:drop-shadow(0 0 15px #22ff66);
}

.snake-right{
  position:absolute;
  right:-40px;
  bottom:130px;
  width:150px;
  opacity:0.25;
  transform:rotate(180deg);
  filter:drop-shadow(0 0 15px #22ff66);
}

.clock{
  position:absolute;
  top:65px;
  left:50%;
  transform:translateX(-50%);
  width:220px;
  height:220px;
  border-radius:50%;
  border:4px solid #22ff66;
  background:rgba(0,0,0,0.2);
  box-shadow:
  0 0 20px #22ff66,
  0 0 50px #22ff6650,
  inset 0 0 20px #22ff6620;
}

.number{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:0 0;
  font-size:16px;
  font-weight:bold;
  color:#22ff66;
  text-shadow:0 0 10px #22ff66;
}

.hand{
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:bottom;
  transform:translateX(-50%);
  border-radius:10px;
}

.hour{
  width:6px;
  height:55px;
  background:white;
}

.minute{
  width:4px;
  height:78px;
  background:#d1d5db;
}

.second{
  width:3px;
  height:95px;
  background:#22ff66;
  box-shadow:0 0 12px #22ff66;
}

.center-dot{
  position:absolute;
  width:18px;
  height:18px;
  background:#22ff66;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 15px #22ff66;
}

.box{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  width:340px;
  padding:24px;
  border-radius:30px;
  background:rgba(255,255,255,0.03);
  border:2px solid rgba(34,255,102,0.4);
  backdrop-filter:blur(20px);
  box-shadow:
  0 0 25px rgba(34,255,102,0.2),
  inset 0 0 15px rgba(255,255,255,0.03);
  text-align:center;
}

.logo{
  font-size:52px;
  font-weight:900;
  margin-bottom:8px;
  letter-spacing:2px;
}

.user{
  font-size:18px;
  color:#d1d5db;
  margin-bottom:25px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.left{
  display:flex;
  align-items:center;
  gap:18px;
  font-size:20px;
  letter-spacing:8px;
}

.icon{
  width:48px;
  height:48px;
  border:2px solid #22ff66;
  border-radius:14px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#22ff66;
  font-size:24px;
  box-shadow:0 0 12px #22ff6650;
}

.value{
  font-size:30px;
  font-weight:bold;
  color:#22ff66;
}

/* Button states */
button{
  width:100%;
  margin-top:28px;
  padding:20px;
  border:none;
  border-radius:20px;
  background:linear-gradient(to bottom,#3dff7f,#18b64d);
  color:white;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:
  0 0 25px #22ff6680,
  inset 0 2px 10px rgba(255,255,255,0.25);
  transition:0.2s;
}

button:active{
  transform:scale(0.97);
}

button:disabled{
  background:linear-gradient(to bottom,#555,#333);
  box-shadow:none;
  cursor:not-allowed;
  opacity:0.6;
}

/* SDK status indicator */
.sdk-status{
  margin-top:10px;
  font-size:11px;
  color:#6b7280;
  min-height:16px;
}

.sdk-status.ready{
  color:#22ff66;
}

.sdk-status.loading{
  color:#facc15;
}

.sdk-status.error{
  color:#f87171;
}

.history{
  margin-top:18px;
  max-height:70px;
  overflow:auto;
  text-align:left;
  font-size:12px;
  color:#cbd5e1;
}

.history div{
  margin-bottom:6px;
}
</style>
</head>

<body>

<img class="snake-left"
src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/Snake_icon.svg/512px-Snake_icon.svg.png">

<img class="snake-right"
src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/Snake_icon.svg/512px-Snake_icon.svg.png">

<!-- CLOCK -->
<div class="clock" id="clock"></div>

<!-- BOX -->
<div class="box">

  <div class="logo">LEION</div>

  <div class="user" id="user">Checking login...</div>

  <div class="row">
    <div class="left">
      <div class="icon">▶</div>
      <span>ADS</span>
    </div>
    <div class="value" id="ads">0</div>
  </div>

  <div class="row">
    <div class="left">
      <div class="icon">★</div>
      <span>POINTS</span>
    </div>
    <div class="value" id="points">0</div>
  </div>

  <button id="watchBtn" onclick="watchAd()" disabled>
    ⏳ Loading Ad...
  </button>

  <div class="sdk-status loading" id="sdkStatus">Ad SDK লোড হচ্ছে...</div>

  <div class="history" id="history"></div>

</div>

<script>

/* ─── CLOCK ─────────────────────────────────── */
const clock = document.getElementById("clock");

for(let i=1;i<=12;i++){
  let num = document.createElement("div");
  num.className = "number";
  num.innerText = i;
  let angle = (i*30) * Math.PI/180;
  let r = 92;
  num.style.transform =
  `translate(-50%,-50%) translate(${Math.sin(angle)*r}px,${-Math.cos(angle)*r}px)`;
  clock.appendChild(num);
}

clock.innerHTML += `
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="center-dot"></div>
`;

function updateClock(){
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  document.getElementById("hour").style.transform =
  `translateX(-50%) rotate(${(h%12)*30 + m*0.5}deg)`;
  document.getElementById("minute").style.transform =
  `translateX(-50%) rotate(${m*6}deg)`;
  document.getElementById("second").style.transform =
  `translateX(-50%) rotate(${s*6}deg)`;
}
setInterval(updateClock, 1000);
updateClock();

/* ─── DATA ───────────────────────────────────── */
let ads = 0;
let points = 0;
let adInProgress = false;

function update(){
  document.getElementById("ads").innerText = ads;
  document.getElementById("points").innerText = points;
}

function addHistory(msg){
  let h = document.getElementById("history");
  let time = new Date().toLocaleTimeString();
  h.innerHTML = `<div>${msg} (${time})</div>` + h.innerHTML;
}

/* ─── TELEGRAM ───────────────────────────────── */
let tg = window.Telegram?.WebApp;
if(tg){
  tg.expand();
  if(tg.initDataUnsafe?.user){
    document.getElementById("user").innerHTML =
    "👤 " + tg.initDataUnsafe.user.first_name;
  } else {
    document.getElementById("user").innerHTML = "👤 Guest";
  }
} else {
  document.getElementById("user").innerHTML = "👤 Guest";
}

/* ─── MONETAG SDK LOADER ─────────────────────── */
/*
  FIX: SDK কে dynamically load করা হচ্ছে।
  SDK ready হলে button enable হবে।
  Timeout দিয়ে check করা হচ্ছে।
*/

const SDK_ZONE = "10996602";
const SDK_FN   = `show_${SDK_ZONE}`;

let sdkReady = false;
let sdkCheckCount = 0;
const MAX_SDK_CHECKS = 30; // 15 seconds max wait

function setSdkStatus(state, msg){
  const el = document.getElementById("sdkStatus");
  el.className = "sdk-status " + state;
  el.textContent = msg;
}

function setSdkReady(){
  sdkReady = true;
  const btn = document.getElementById("watchBtn");
  btn.disabled = false;
  btn.textContent = "▶ Watch Ad";
  setSdkStatus("ready", "✅ Ad SDK রেডি");
}

function checkSdkReady(){
  if(typeof window[SDK_FN] === "function"){
    setSdkReady();
    return;
  }
  sdkCheckCount++;
  if(sdkCheckCount >= MAX_SDK_CHECKS){
    setSdkStatus("error", "❌ Ad SDK লোড হয়নি — নেটওয়ার্ক চেক করুন");
    const btn = document.getElementById("watchBtn");
    btn.disabled = false;
    btn.textContent = "▶ Watch Ad (Retry)";
    return;
  }
  setTimeout(checkSdkReady, 500);
}

function loadMonetag(){
  // Already loaded check
  if(document.querySelector(`script[data-zone="${SDK_ZONE}"]`)){
    checkSdkReady();
    return;
  }

  const script = document.createElement("script");
  script.src = "https://libtl.com/sdk.js";
  script.setAttribute("data-zone", SDK_ZONE);
  script.setAttribute("data-sdk", SDK_FN);
  script.async = true;

  script.onload = () => {
    setSdkStatus("loading", "⏳ SDK লোড হয়েছে, শুরু হচ্ছে...");
    // SDK load হওয়ার পরেও function ready হতে কিছুটা সময় লাগে
    setTimeout(checkSdkReady, 500);
  };

  script.onerror = () => {
    setSdkStatus("error", "❌ SDK লোড করতে পারেনি");
    const btn = document.getElementById("watchBtn");
    btn.disabled = false;
    btn.textContent = "▶ Retry";
  };

  document.head.appendChild(script);
  setSdkStatus("loading", "⏳ Ad SDK লোড হচ্ছে...");
  checkSdkReady();
}

// Page load হলেই SDK শুরু করো
window.addEventListener("load", loadMonetag);

/* ─── WATCH AD ───────────────────────────────── */
async function watchAd(){
  if(adInProgress) return;

  const btn = document.getElementById("watchBtn");

  // SDK ready না হলে আবার চেক করো
  if(!sdkReady){
    if(typeof window[SDK_FN] === "function"){
      setSdkReady();
    } else {
      setSdkStatus("loading", "⏳ SDK এখনো লোড হচ্ছে, একটু অপেক্ষা করুন...");
      sdkCheckCount = 0;
      checkSdkReady();
      return;
    }
  }

  adInProgress = true;
  btn.disabled = true;
  btn.textContent = "⏳ Ad চলছে...";
  setSdkStatus("loading", "📺 Ad দেখানো হচ্ছে...");

  try{
    await window[SDK_FN]();

    ads++;
    points++;
    update();
    addHistory("✅ +1 Coin Earned");
    setSdkStatus("ready", "✅ Ad দেখা হয়েছে! Coin পেয়েছেন।");

  }catch(err){
    console.error("Ad error:", err);
    // User skip করলে বা error হলে
    if(err && (err.code === 4 || String(err).includes("skip"))){
      setSdkStatus("error", "⚠️ Ad skip করা হয়েছে — Coin পাননি");
    } else {
      setSdkStatus("error", "⚠️ Ad দেখানো যায়নি, আবার চেষ্টা করুন");
    }
  }finally{
    adInProgress = false;
    btn.disabled = false;
    btn.textContent = "▶ Watch Ad";
  }
}

update();
</script>

</body>
</html>
