<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Monetag -->
<script src='//libtl.com/sdk.js' data-zone='10992255' data-sdk='show_10992255'></script>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Self Earn</title>

<style>

/* 🌌 Background */
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', sans-serif;
  color:white;
  overflow:hidden;
  background: linear-gradient(-45deg, #020617, #0f172a, #020617, #1e293b);
  background-size: 400% 400%;
  animation: bgMove 10s ease infinite;
}

@keyframes bgMove {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* ⚡ Canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* 🧊 Card */
.box {
  width:360px;
  padding:25px;
  border-radius:20px;
  backdrop-filter: blur(15px);
  background: rgba(30,41,59,0.6);
  text-align:center;
  z-index:2;
  position:relative;
}

/* ⚡ Power Line */
.power-line {
  margin-top:15px;
  height:20px;
  position:relative;
}

.line {
  width:100%;
  height:4px;
  background: rgba(255,255,255,0.2);
  border-radius:10px;
  position:absolute;
  top:50%;
  transform:translateY(-50%);
}

.energy {
  width:10px;
  height:10px;
  background:#4ade80;
  border-radius:50%;
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  box-shadow:0 0 10px #4ade80;
  animation: moveEnergy 2s linear infinite;
}

@keyframes moveEnergy {
  0% { left:0%; }
  100% { left:100%; }
}

/* Button */
button {
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background: linear-gradient(90deg,#22c55e,#4ade80);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="box">
  <h2>⚡ Self Earn</h2>

  <p id="user">Checking login...</p>
  <p>📺 Ads: <span id="ads">0</span></p>
  <p>💰 Points: <span id="points">0</span></p>

  <!-- ⚡ Power Flow -->
  <div class="power-line">
    <div class="line"></div>
    <div class="energy"></div>
  </div>

  <button onclick="watchAd()">🚀 Watch Ad</button>
</div>

<script>

// Ads logic
let ads = 0;
let points = 0;

let tg = window.Telegram.WebApp;
tg.expand();

if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
  document.getElementById("user").innerText =
    "👤 " + tg.initDataUnsafe.user.first_name;
} else {
  document.getElementById("user").innerText = "❌ Open from Telegram";
}

function update() {
  document.getElementById("ads").innerText = ads;
  document.getElementById("points").innerText = points;
}

function watchAd() {
  if (typeof show_10992255 === 'function') {
    show_10992255().then(() => {
      ads++;
      points++;
      update();
    }).catch(() => alert("Ad failed ❌"));
  } else {
    alert("SDK not loaded ❌");
  }
}

update();


// ⚡ Background Electric Network
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let nodes = [];
for (let i = 0; i < 25; i++) {
  nodes.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {

      let dx = nodes[i].x - nodes[j].x;
      let dy = nodes[i].y - nodes[j].y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 350) {
        ctx.strokeStyle = "rgba(34,197,94,0.15)";
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();

        let progress = (Date.now() % 2000) / 2000;

        let px = nodes[i].x + (nodes[j].x - nodes[i].x) * progress;
        let py = nodes[i].y + (nodes[j].y - nodes[i].y) * progress;

        ctx.fillStyle = "#4ade80";
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  nodes.forEach(n => {
    ctx.fillStyle = "#22c55e";
    ctx.beginPath();
    ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
