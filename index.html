<body>

<canvas id="bg"></canvas>

<div class="box">

  <h2>LEION</h2>

  <p id="user">Checking login...</p>

  <div class="stat">
    <span>📺 ADS</span>
    <span class="value" id="ads">0</span>
  </div>

  <div class="stat">
    <span>⭐ POINTS</span>
    <span class="value" id="points">0</span>
  </div>

  <!-- ⚡ Animation -->
  <div class="power-line">
    <div class="line"></div>
    <div class="energy"></div>
  </div>

  <button onclick="watchAd()">▶ Watch Ad</button>

</div>

<script>

// 📺 Ads + Points
let ads = 0;
let points = 0;

// ✅ Telegram
let tg = window.Telegram.WebApp;
tg.expand();

if (tg.initDataUnsafe && tg.initDataUnsafe.user) {

  let user = tg.initDataUnsafe.user;

  document.getElementById("user").innerText =
    "👤 " + user.first_name;

} else {

  document.getElementById("user").innerText =
    "❌ Open from Telegram Bot";
}

// ✅ Update UI
function update() {

  document.getElementById("ads").innerText = ads;
  document.getElementById("points").innerText = points;

}

// ✅ Watch Ad
function watchAd() {

  if (typeof show_10992255 === 'function') {

    show_10992255().then(() => {

      ads++;
      points++;

      update();

    }).catch(() => {

      alert("Ad failed ❌");

    });

  } else {

    alert("SDK not loaded ❌");

  }

}

update();


// ⚡ Animated Background
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize() {

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize", resize);

let nodes = [];

for (let i = 0; i < 25; i++) {

  nodes.push({

    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height

  });

}

function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < nodes.length; i++) {

    for (let j = i + 1; j < nodes.length; j++) {

      let dx = nodes[i].x - nodes[j].x;
      let dy = nodes[i].y - nodes[j].y;

      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 350) {

        ctx.strokeStyle = "rgba(34,197,94,0.15)";

        ctx.beginPath();

        ctx.moveTo(nodes[i].x, nodes[i].y);

        ctx.lineTo(nodes[j].x, nodes[j].y);

        ctx.stroke();

        let progress = (Date.now() % 2000) / 2000;

        let px = nodes[i].x + (nodes[j].x - nodes[i].x) * progress;

        let py = nodes[i].y + (nodes[j].y - nodes[i].y) * progress;

        ctx.fillStyle = "#4ade80";

        ctx.beginPath();

        ctx.arc(px, py, 3, 0, Math.PI * 2);

        ctx.fill();

      }

    }

  }

  nodes.forEach(n => {

    ctx.fillStyle = "#22c55e";

    ctx.beginPath();

    ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);

    ctx.fill();

  });

  requestAnimationFrame(draw);

}

draw();

</script>
