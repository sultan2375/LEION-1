<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LEION Clock UI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
  background:#000;
  position:relative;
}

/* Background Image */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('https://files.catbox.moe/6a7v0q.png') center center/cover no-repeat;
  filter:brightness(0.45);
  z-index:-3;
}

/* Dark Overlay */
body::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.45);
  z-index:-2;
}

.container{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Power Lines */
.power-lines{
  position:absolute;
  width:100%;
  height:100%;
  overflow:hidden;
}

.line{
  position:absolute;
  height:2px;
  width:100%;
  background:linear-gradient(90deg,
  transparent,
  rgba(255,255,255,0.1),
  rgba(255,255,255,0.6),
  rgba(255,255,255,1),
  rgba(255,255,255,0.6),
  transparent);
  background-size:200px 100%;
  animation:flow 2s linear infinite;
  opacity:0.8;
}

.line::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:repeating-linear-gradient(
    90deg,
    transparent 0px,
    transparent 8px,
    white 8px,
    white 12px
  );
}

.line1{ top:20%; animation-duration:2s; }
.line2{ top:35%; animation-duration:1.5s; }
.line3{ top:50%; animation-duration:2.5s; }
.line4{ top:65%; animation-duration:1.8s; }
.line5{ top:80%; animation-duration:2.2s; }

@keyframes flow{
  0%{
    transform:translateX(-100%);
  }
  100%{
    transform:translateX(100%);
  }
}

/* Analog Clock */
.clock{
  position:absolute;
  top:60px;
  width:240px;
  height:240px;
  border-radius:50%;
  border:8px solid rgba(255,255,255,0.3);
  backdrop-filter:blur(10px);
  background:rgba(0,0,0,0.35);
  box-shadow:
  0 0 25px rgba(255,255,255,0.15),
  inset 0 0 20px rgba(255,255,255,0.08);
}

.number{
  position:absolute;
  width:100%;
  height:100%;
  text-align:center;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.number span{
  display:block;
  transform:translateY(12px);
}

.number1{ transform:rotate(30deg); }
.number1 span{ transform:rotate(-30deg); }

.number2{ transform:rotate(60deg); }
.number2 span{ transform:rotate(-60deg); }

.number3{ transform:rotate(90deg); }
.number3 span{ transform:rotate(-90deg); }

.number4{ transform:rotate(120deg); }
.number4 span{ transform:rotate(-120deg); }

.number5{ transform:rotate(150deg); }
.number5 span{ transform:rotate(-150deg); }

.number6{ transform:rotate(180deg); }
.number6 span{ transform:rotate(-180deg); }

.number7{ transform:rotate(210deg); }
.number7 span{ transform:rotate(-210deg); }

.number8{ transform:rotate(240deg); }
.number8 span{ transform:rotate(-240deg); }

.number9{ transform:rotate(270deg); }
.number9 span{ transform:rotate(-270deg); }

.number10{ transform:rotate(300deg); }
.number10 span{ transform:rotate(-300deg); }

.number11{ transform:rotate(330deg); }
.number11 span{ transform:rotate(-330deg); }

.hand{
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:bottom;
  transform:translateX(-50%);
  border-radius:10px;
}

.hour{
  width:7px;
  height:65px;
  background:white;
}

.minute{
  width:5px;
  height:90px;
  background:#d1d5db;
}

.second{
  width:2px;
  height:100px;
  background:#22c55e;
}

.center-dot{
  position:absolute;
  width:16px;
  height:16px;
  background:white;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 15px white;
}

.logo-box{
  position:absolute;
  bottom:80px;
  text-align:center;
}

.logo-box img{
  width:320px;
  max-width:90%;
  filter:drop-shadow(0 0 20px rgba(255,255,255,0.2));
}

@media(max-width:600px){
  .clock{
    width:200px;
    height:200px;
    top:40px;
  }

  .logo-box img{
    width:260px;
  }
}
</style>
</head>
<body>

<div class="container">

  <!-- Animated Power Lines -->
  <div class="power-lines">
    <div class="line line1"></div>
    <div class="line line2"></div>
    <div class="line line3"></div>
    <div class="line line4"></div>
    <div class="line line5"></div>
  </div>

  <!-- Analog Clock -->
  <div class="clock">

    <div class="number number1"><span>1</span></div>
    <div class="number number2"><span>2</span></div>
    <div class="number number3"><span>3</span></div>
    <div class="number number4"><span>4</span></div>
    <div class="number number5"><span>5</span></div>
    <div class="number number6"><span>6</span></div>
    <div class="number number7"><span>7</span></div>
    <div class="number number8"><span>8</span></div>
    <div class="number number9"><span>9</span></div>
    <div class="number number10"><span>10</span></div>
    <div class="number number11"><span>11</span></div>
    <div class="number number12"><span>12</span></div>

    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>

    <div class="center-dot"></div>
  </div>

  <!-- Logo -->
  <div class="logo-box">
    <img src="https://files.catbox.moe/6a7v0q.png" alt="LEION Logo">
  </div>

</div>

<script>
const hour = document.getElementById('hour');
const minute = document.getElementById('minute');
const second = document.getElementById('second');

function updateClock(){
  const now = new Date();

  const hr = now.getHours();
  const min = now.getMinutes();
  const sec = now.getSeconds();

  const hrDeg = (hr % 12) * 30 + min * 0.5;
  const minDeg = min * 6;
  const secDeg = sec * 6;

  hour.style.transform = `translateX(-50%) rotate(${hrDeg}deg)`;
  minute.style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
  second.style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
      </html>
