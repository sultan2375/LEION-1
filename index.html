<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Monetag -->
<script src='//libtl.com/sdk.js' data-zone='10998524' data-sdk='show_10998524'></script>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Self Earn Pro</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:'Segoe UI',sans-serif;
  color:white;
  background: radial-gradient(circle at top left,#312e81,#0f172a,#020617);
}

/* Animated Glow Background */
body::before,
body::after{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  filter:blur(120px);
  opacity:0.5;
  animation:moveGlow 12s infinite alternate ease-in-out;
}

body::before{
  background:#06b6d4;
  top:-150px;
  left:-150px;
}

body::after{
  background:#22c55e;
  bottom:-150px;
  right:-150px;
}

@keyframes moveGlow{
  0%{
    transform:translate(0,0) scale(1);
  }
  100%{
    transform:translate(60px,40px) scale(1.2);
  }
}

canvas{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:0;
}

/* Main Card */
.box{
  width:360px;
  padding:28px;
  border-radius:24px;
  background:rgba(15,23,42,0.55);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  text-align:center;
  position:relative;
  z-index:2;
  box-shadow:0 0 30px rgba(34,197,94,0.15);
}

.logo{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  background:linear-gradient(135deg,#22c55e,#06b6d4);
  box-shadow:0 0 25px rgba(34,197,94,0.4);
}

h2{
  margin-top:15px;
  font-size:28px;
}

.info{
  margin-top:18px;
  background:rgba(255,255,255,0.05);
  padding:14px;
  border-radius:16px;
}

.info p{
  margin:10px 0;
  font-size:17px;
}

/* Progress Bar */
.progress{
  width:100%;
  height:10px;
  background:rgba(255,255,255,0.1);
  border-radius:30px;
  margin-top:20px;
  overflow:hidden;
}

.bar{
  width:0%;
  height:100%;
  border-radius:30px;
  background:linear-gradient(90deg,#22c55e,#06b6d4);
  transition:0.4s;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  margin-top:22px;
  font-size:16px;
  font-weight:bold;
  color:white;
  cursor:pointer;
  background:linear-gradient(90deg,#22c55e,#06b6d4);
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
  box-shadow:0 0 20px rgba(6,182,212,0.4);
}

</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="box">

  <div class="logo">⚡</div>

  <h2>Self Earn Pro</h2>

  <div class="info">
    <p id="user">Checking login...</p>
    <p>📺 Ads Watched: <span id="ads">0</span></p>
    <p>💰 Total Points: <span id="points">0</span></p>
  </div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <button onclick="watchAd()">🚀 Watch Ad & Earn</button>

</div>

<script>

let ads = 0;
let points = 0;

let tg = window.Telegram.WebApp;
tg.expand();

if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
  document.getElementById("user").innerText =
    "👤 " + tg.initDataUnsafe.user.first_name;
} else {
  document.getElementById("user").innerText = "❌ Open from Telegram";
}

function update(){
  document.getElementById("ads").innerText = ads;
  document.getElementById("points").innerText = points;

  let progress = (ads % 10) * 10;
  document.getElementById("bar").style.width = progress + "%";
}

function watchAd(){
  if(typeof show_10998524 === 'function'){
    show_10998524().then(() => {
      ads++;
      points += 2;
      update();
    }).catch(() => alert("Ad failed ❌"));
  } else {
    alert("SDK not loaded ❌");
  }
}

update();

/* Animated Particle Background */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const particles = [];

for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2+1,
    dx:(Math.random()-0.5)*0.6,
    dy:(Math.random()-0.5)*0.6
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p => {
    p.x += p.dx;
    p.y += p.dy;

    if(p.x<0 || p.x>canvas.width) p.dx *= -1;
    if(p.y<0 || p.y>canvas.height) p.dy *= -1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(34,197,94,0.7)';
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
