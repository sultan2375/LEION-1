<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src='//libtl.com/sdk.js' data-zone='10988983' data-sdk='show_10988983'></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>LEION Reward App</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#020617;
  color:white;
  font-family:Arial;
  height:100vh;
  overflow:hidden;
}

/* Clock */
.clock{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  width:240px;
  height:240px;
  border-radius:50%;
  border:3px solid #22c55e;
  box-shadow:0 0 30px #22c55e55, inset 0 0 20px #22c55e22;
}

/* Numbers circle */
.number{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:0 0;
  font-size:14px;
  color:#22c55e;
}

/* Hands */
.hand{
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:bottom;
  transform:translateX(-50%);
}
.hour{width:5px;height:60px;background:white;}
.minute{width:3px;height:85px;background:#ccc;}
.second{width:2px;height:100px;background:#22c55e;}

.center-dot{
  position:absolute;
  width:10px;
  height:10px;
  background:#22c55e;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* Box */
.box{
  position:absolute;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  width:350px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  padding:20px;
  border-radius:20px;
  text-align:center;
}

button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  box-shadow:0 0 15px #22c55e88;
}

.counter{
  font-size:22px;
  font-weight:bold;
}

/* History */
.history{
  margin-top:10px;
  font-size:12px;
  text-align:left;
  max-height:80px;
  overflow:auto;
}
</style>
</head>

<body>

<div class="clock" id="clock"></div>

<div class="box">
  <h2>Ad Reward</h2>
  <p id="user">Checking login...</p>

  <p>Ads: <span id="ads">0</span></p>

  <p>Points:</p>
  <div class="counter" id="points">0</div>

  <button onclick="watchAd()">Watch Ad</button>

  <div class="history" id="history"></div>
</div>

<script>
/* Create 1-12 numbers */
const clock=document.getElementById("clock");
for(let i=1;i<=12;i++){
  let num=document.createElement("div");
  num.className="number";
  num.innerText=i;

  let angle=(i*30)*Math.PI/180;
  let r=100;

  num.style.transform=`translate(-50%,-50%) translate(${Math.sin(angle)*r}px,${-Math.cos(angle)*r}px)`;

  clock.appendChild(num);
}

/* Clock */
function updateClock(){
  const now=new Date();
  const h=now.getHours();
  const m=now.getMinutes();
  const s=now.getSeconds();

  hour.style.transform=`translateX(-50%) rotate(${(h%12)*30+m*0.5}deg)`;
  minute.style.transform=`translateX(-50%) rotate(${m*6}deg)`;
  second.style.transform=`translateX(-50%) rotate(${s*6}deg)`;
}

/* Add hands */
clock.innerHTML+=`
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="center-dot"></div>
`;

setInterval(updateClock,1000);
updateClock();

/* Data */
let ads=0;
let points=0;

/* History */
function addHistory(text){
  let h=document.getElementById("history");
  let time=new Date().toLocaleTimeString();
  h.innerHTML=`<div>+1 coin (${time})</div>`+h.innerHTML;
}

/* Telegram */
let tg=window.Telegram.WebApp;
tg.expand();

if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
  let user = tg.initDataUnsafe.user;
  document.getElementById("user").innerText =
    "👤 " + user.first_name;
}

/* Update */
function update(){
  document.getElementById("ads").innerText=ads;
  document.getElementById("points").innerText=points;
}

/* Ad */
function watchAd(){
  if(typeof show_10988983==='function'){
    show_10988983().then(()=>{
      ads++;
      points++;
      addHistory();
      update();
    });
  }
}

update();
</script>

</body>
</html>
