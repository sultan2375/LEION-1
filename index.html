<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src='//libtl.com/sdk.js' data-zone='10996602' data-sdk='show_10996602'></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>LEION Reward App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:
    radial-gradient(circle at top,#052b18 0%,#01040c 35%,#000000 100%);
  color:white;
  font-family:Arial, sans-serif;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* Floating glow particles */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background-image:
    radial-gradient(#22c55e66 1px, transparent 1px);
  background-size:35px 35px;
  opacity:0.2;
  pointer-events:none;
}

/* Snake Left */
.snake-left{
  position:absolute;
  left:-40px;
  top:140px;
  width:180px;
  opacity:0.9;
  filter:drop-shadow(0 0 12px #22c55e);
  transform:rotate(-10deg);
}

/* Snake Right */
.snake-right{
  position:absolute;
  right:-30px;
  bottom:120px;
  width:180px;
  opacity:0.9;
  filter:drop-shadow(0 0 12px #22c55e);
  transform:rotate(12deg);
}

/* Clock */
.clock{
  position:absolute;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  width:270px;
  height:270px;
  border-radius:50%;
  border:4px solid #22ff66;
  box-shadow:
    0 0 20px #22ff66,
    0 0 60px #22ff6644,
    inset 0 0 20px #22ff6633;
  background:rgba(0,0,0,0.15);
}

/* Clock Numbers */
.number{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:0 0;
  font-size:18px;
  font-weight:bold;
  color:#22ff66;
  text-shadow:0 0 10px #22ff66;
}

/* Clock Hands */
.hand{
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:bottom;
  transform:translateX(-50%);
  border-radius:10px;
}

.hour{
  width:6px;
  height:65px;
  background:white;
}

.minute{
  width:4px;
  height:95px;
  background:#d1d5db;
}

.second{
  width:3px;
  height:110px;
  background:#22ff66;
  box-shadow:0 0 12px #22ff66;
}

.center-dot{
  position:absolute;
  width:18px;
  height:18px;
  background:#22ff66;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 15px #22ff66;
}

/* Main Glass Box */
.box{
  position:absolute;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  width:360px;
  padding:25px;
  border-radius:28px;
  text-align:center;

  background:rgba(255,255,255,0.04);
  border:2px solid rgba(34,255,102,0.45);

  backdrop-filter:blur(18px);

  box-shadow:
    0 0 25px rgba(34,255,102,0.25),
    inset 0 0 12px rgba(255,255,255,0.04);
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:5px;
}

.user{
  color:#d1d5db;
  margin-bottom:20px;
  font-size:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 0;
  font-size:20px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.row:last-child{
  border:none;
}

.left{
  display:flex;
  align-items:center;
  gap:12px;
  letter-spacing:8px;
}

.icon{
  width:42px;
  height:42px;
  border:2px solid #22ff66;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#22ff66;
  font-size:20px;
  box-shadow:0 0 10px #22ff6655;
}

.value{
  font-size:28px;
  color:#22ff66;
  font-weight:bold;
}

/* Button */
button{
  width:100%;
  padding:18px;
  margin-top:20px;
  border:none;
  border-radius:18px;
  background:linear-gradient(to bottom,#30ff72,#18b64d);
  color:white;
  font-size:28px;
  font-weight:bold;
  cursor:pointer;

  box-shadow:
    0 0 18px #22ff66aa,
    inset 0 2px 10px rgba(255,255,255,0.3);

  transition:0.2s;
}

button:active{
  transform:scale(0.98);
}

/* History */
.history{
  margin-top:18px;
  max-height:80px;
  overflow:auto;
  font-size:12px;
  text-align:left;
  color:#cbd5e1;
}

.history div{
  margin-bottom:6px;
}
</style>
</head>

<body>

<!-- Snake SVG Left -->
<img class="snake-left"
src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/Snake_icon.svg/512px-Snake_icon.svg.png">

<!-- Snake SVG Right -->
<img class="snake-right"
src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/Snake_icon.svg/512px-Snake_icon.svg.png">

<!-- CLOCK -->
<div class="clock" id="clock"></div>

<!-- GLASS BOX -->
<div class="box">

  <div class="logo">LEION</div>

  <div class="user" id="user">Checking login...</div>

  <div class="row">
    <div class="left">
      <div class="icon">▶</div>
      <span>ADS</span>
    </div>

    <div class="value" id="ads">0</div>
  </div>

  <div class="row">
    <div class="left">
      <div class="icon">★</div>
      <span>POINTS</span>
    </div>

    <div class="value" id="points">0</div>
  </div>

  <button onclick="watchAd()">▶ Watch Ad</button>

  <div class="history" id="history"></div>

</div>

<script>
/* CLOCK NUMBERS */
const clock = document.getElementById("clock");

for(let i=1;i<=12;i++){

  let num=document.createElement("div");

  num.className="number";
  num.innerText=i;

  let angle=(i*30)*Math.PI/180;
  let r=115;

  num.style.transform=
    `translate(-50%,-50%)
    translate(${Math.sin(angle)*r}px,
    ${-Math.cos(angle)*r}px)`;

  clock.appendChild(num);
}

/* HANDS */
clock.innerHTML += `
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="center-dot"></div>
`;

/* CLOCK UPDATE */
function updateClock(){

  const now = new Date();

  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  document.getElementById("hour").style.transform =
    `translateX(-50%) rotate(${(h%12)*30 + m*0.5}deg)`;

  document.getElementById("minute").style.transform =
    `translateX(-50%) rotate(${m*6}deg)`;

  document.getElementById("second").style.transform =
    `translateX(-50%) rotate(${s*6}deg)`;
}

setInterval(updateClock,1000);
updateClock();

/* DATA */
let ads = 0;
let points = 0;

/* UPDATE UI */
function update(){

  document.getElementById("ads").innerText = ads;

  document.getElementById("points").innerText = points;
}

/* HISTORY */
function addHistory(){

  let h = document.getElementById("history");

  let time = new Date().toLocaleTimeString();

  h.innerHTML =
    `<div>+1 coin earned (${time})</div>` +
    h.innerHTML;
}

/* TELEGRAM */
let tg = window.Telegram.WebApp;

tg.expand();

if(tg.initDataUnsafe && tg.initDataUnsafe.user){

  let user = tg.initDataUnsafe.user;

  document.getElementById("user").innerText =
    "👤 " + user.first_name;
}

/* WATCH AD */
function watchAd(){

  if(typeof show_10996602 === 'function'){

    show_10996602().then(()=>{

      ads++;
      points++;

      addHistory();

      update();
    });

  }else{

    alert("Ad SDK not loaded.");
  }
}

update();
</script>

</body>
</html>
