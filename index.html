<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='10988983' data-sdk='show_10988983'></script>

<!-- ✅ Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>LEION Reward App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:linear-gradient(135deg,#020617,#0f172a,#111827);
  color:white;
  font-family:Arial,sans-serif;
  width:100%;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* Animated Dotted Power Lines */
.power-lines{
  position:absolute;
  width:100%;
  height:100%;
  overflow:hidden;
}

.line{
  position:absolute;
  width:200%;
  height:2px;
  background:repeating-linear-gradient(
    90deg,
    transparent 0px,
    transparent 10px,
    rgba(255,255,255,0.9) 10px,
    rgba(255,255,255,0.9) 15px
  );
  animation:move 5s linear infinite;
  opacity:0.7;
}

.line1{ top:20%; }
.line2{ top:35%; animation-duration:4s; }
.line3{ top:50%; animation-duration:6s; }
.line4{ top:65%; animation-duration:4.5s; }
.line5{ top:80%; animation-duration:5.5s; }

@keyframes move{
  from{
    transform:translateX(-50%);
  }
  to{
    transform:translateX(0%);
  }
}

/* Analog Clock */
.clock{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  width:220px;
  height:220px;
  border:8px solid rgba(255,255,255,0.15);
  border-radius:50%;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,0.04);
  box-shadow:0 0 25px rgba(255,255,255,0.1);
}

.hand{
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:bottom;
  transform:translateX(-50%);
  border-radius:20px;
}

.hour{
  width:6px;
  height:60px;
  background:white;
}

.minute{
  width:4px;
  height:80px;
  background:#d1d5db;
}

.second{
  width:2px;
  height:90px;
  background:#22c55e;
}

.center-dot{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:white;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* Logo */
.logo{
  position:absolute;
  top:290px;
  left:50%;
  transform:translateX(-50%);
}

.logo img{
  width:240px;
  max-width:90%;
}

/* Reward Box */
.box{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  width:350px;
  background:rgba(30,41,59,0.7);
  backdrop-filter:blur(12px);
  padding:20px;
  border-radius:20px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 30px rgba(0,0,0,0.5);
}

button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
}

.progress{
  height:10px;
  background:#334155;
  margin-top:12px;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#22c55e;
  width:0%;
  border-radius:10px;
  transition:0.4s;
}

@media(max-width:600px){
  .clock{
    width:180px;
    height:180px;
  }

  .logo{
    top:250px;
  }

  .logo img{
    width:180px;
  }

  .box{
    width:90%;
  }
}
</style>
</head>
<body>

<!-- Power Lines -->
<div class="power-lines">
  <div class="line line1"></div>
  <div class="line line2"></div>
  <div class="line line3"></div>
  <div class="line line4"></div>
  <div class="line line5"></div>
</div>

<!-- Analog Clock -->
<div class="clock">
  <div class="hand hour" id="hour"></div>
  <div class="hand minute" id="minute"></div>
  <div class="hand second" id="second"></div>
  <div class="center-dot"></div>
</div>

<!-- Logo -->
<div class="logo">
  <img src="logo.png" alt="LEION Logo">
</div>

<!-- Original Reward Features -->
<div class="box">
  <h2>Ad Reward</h2>

  <p id="user">Checking login...</p>

  <p>Ads: <span id="ads">0</span></p>
  <p>Points: <span id="points">0</span></p>

  <div class="progress">
    <div class="fill" id="fill"></div>
  </div>

  <button onclick="watchAd()">Watch Ad</button>
</div>

<script>
/* Clock */
const hour = document.getElementById('hour');
const minute = document.getElementById('minute');
const second = document.getElementById('second');

function updateClock(){
  const now = new Date();

  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  const hDeg = (h % 12) * 30 + m * 0.5;
  const mDeg = m * 6;
  const sDeg = s * 6;

  hour.style.transform = `translateX(-50%) rotate(${hDeg}deg)`;
  minute.style.transform = `translateX(-50%) rotate(${mDeg}deg)`;
  second.style.transform = `translateX(-50%) rotate(${sDeg}deg)`;
}

setInterval(updateClock,1000);
updateClock();

/* Original Reward System */
let ads = 0;
let points = 0;

// Telegram Login
let tg = window.Telegram.WebApp;
tg.expand();

if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
  let user = tg.initDataUnsafe.user;
  document.getElementById("user").innerText =
    "👤 " + user.first_name + " (" + user.id + ")";
} else {
  document.getElementById("user").innerText =
    "❌ Open from Telegram Bot";
}

// Update UI
function update() {
  document.getElementById("ads").innerText = ads;
  document.getElementById("points").innerText = points;
  document.getElementById("fill").style.width = (ads % 100) + "%";
}

// Watch Ad (Monetag)
function watchAd() {
  if (typeof show_10988983 === 'function') {

    show_10988983().then(() => {
      ads++;
      points++;

      if (ads % 2 === 0) {
        points += 5;
        alert("🎁 Bonus +5");
      }

      update();
    }).catch(() => {
      alert("Ad failed ❌");
    });

  } else {
    alert("SDK not loaded ❌");
  }
}

update();
</script>

</body>
</html>
